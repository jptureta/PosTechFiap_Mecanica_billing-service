apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: billing-service
          image: ghcr.io/jptureta/oficina-billing-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: database-url
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: internal-service-token
            - name: PAYMENT_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: payment-provider-token
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: mercado-pago-access-token
            - name: MERCADO_PAGO_USER_ID
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: mercado-pago-user-id
            - name: MERCADO_PAGO_POS_ID
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: mercado-pago-pos-id
            - name: MERCADO_PAGO_NOTIFICATION_URL
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: mercado-pago-notification-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: jwt-secret-key
            - name: JWT_ALGORITHM
              value: HS256
            - name: OS_SERVICE_URL
              value: http://os-service:8000
            - name: MESSAGING_ENABLED
              value: "true"
            - name: AWS_REGION
              value: us-east-1
            - name: OS_EVENTS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: os-events-queue-url
                  optional: true
            - name: BILLING_COMMANDS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: billing-commands-queue-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
              initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: oficina
spec:
  selector:
    app: billing-service
  ports:
    - port: 8000
      targetPort: 8000
